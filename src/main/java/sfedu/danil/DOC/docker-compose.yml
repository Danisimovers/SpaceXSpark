version: "3.9"

services:
  spacex-spark:
    build: .
    container_name: spacex-spark
    ports:
      - "4040:4040"   # Spark UI
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/spacex
      - SPRING_DATASOURCE_USER=postgres
      - SPRING_DATASOURCE_PASSWORD=database
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: spacex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
