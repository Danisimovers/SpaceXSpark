name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Ставим Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Кэшируем Maven
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Собираем fat JAR (важно: должен собираться shade!)
      - name: Maven package (fat JAR)
        run: mvn -B clean package -DskipTests

      # 5. Билдим Docker image
      - name: Build Docker image
        run: docker build -t spacex-spark:latest .

      # 6. Запуск контейнера + проверка, что он стартует
      - name: Run container and validate startup
        run: |
          echo "➡ Стартуем контейнер…"
          docker run -d --name spacex_container spacex-spark:latest

          echo "➡ Ждём 5 секунд..."
          sleep 5

          echo "➡ Логи контейнера:"
          docker logs spacex_container | head -n 50

          echo "➡ Проверяем что контейнер не упал..."
          docker ps -a

      # 7. Остановка и удаление контейнера
      - name: Cleanup container
        if: always()
        run: |
          docker stop spacex_container || true
          docker rm spacex_container || true
