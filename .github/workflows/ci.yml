name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Ставим Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Кэшируем Maven
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Явный запуск JUnit тестов
      - name: Run JUnit tests
        run: mvn -B test

      # 5. Сборка fat JAR (тесты уже прошли)
      - name: Build fat JAR
        run: mvn -B package

      # 6. Билдим Docker image
      - name: Build Docker image
        run: docker build -t spacex-spark:latest .

      # 7. Запуск контейнера + проверка, что он стартует
      - name: Run container and validate startup
        run: |
          echo "➡ Стартуем контейнер…"
          docker run -d --name spacex_container spacex-spark:latest

          echo "➡ Ждём 5 секунд..."
          sleep 5

          echo "➡ Логи контейнера:"
          docker logs spacex_container | head -n 50

          echo "➡ Проверяем что контейнер не упал..."
          docker ps -a

      # 8. Остановка и удаление контейнера
      - name: Cleanup container
        if: always()
        run: |
          docker stop spacex_container || true
          docker rm spacex_container || true
