name: CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Собираем проект с Maven
      - name: Build the project
        run: mvn clean package -DskipTests

      # 3. Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Пушим Docker образ в Docker Hub
      - name: Build and push Docker image
        run: |
          docker build -t spacex-spark:latest .
          docker tag spacex-spark:latest danisimover/spacex-spark:latest
          docker push danisimover/spacex-spark:latest
