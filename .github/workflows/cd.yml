name: CD Pipeline

on:
  workflow_run:
    workflows: ["ci"]  # Здесь указываем имя CI пайплайна, который нужно дождаться
    types:
      - completed  # Запускаем CD только после завершения CI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собираем Docker образ
      - name: Build Docker image
        run: docker build -t spacex-spark:latest .

      # 4. Пушим Docker образ в Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker tag spacex-spark:latest danisimover/spacex-spark:latest
          docker push danisimover/spacex-spark:latest
